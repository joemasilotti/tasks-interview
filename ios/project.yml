# Regenerate the Xcode project after editing this file: `xcodegen generate` (brew install xcodegen).
# The generated project is committed so you can open it in Xcode without installing anything.
name: TasksInterview
options:
  bundleIdPrefix: travel.tern.interview
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  HotwireNative:
    url: https://github.com/hotwired/hotwire-native-ios
    from: "1.3.0"

targets:
  TasksInterview:
    type: application
    platform: iOS
    sources:
      - TasksInterview
    dependencies:
      - package: HotwireNative
    info:
      path: TasksInterview/Info.plist
      properties:
        CFBundleDisplayName: Tasks
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic

schemes:
  TasksInterview:
    build:
      targets:
        TasksInterview: all
    run:
      config: Debug
      environmentVariables:
        SERVER_URL: http://localhost:3000
